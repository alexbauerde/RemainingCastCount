<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2433"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c46a"/>
      <stop offset="0.5" stop-color="#8a6a2a"/>
      <stop offset="1" stop-color="#d9b25a"/>
    </linearGradient>
    <radialGradient id="mana" cx="0.4" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="0.45" stop-color="#2a8cf0"/>
      <stop offset="1" stop-color="#0a2f8c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#3aa0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aktionsbutton -->
  <rect x="8" y="8" width="384" height="384" rx="56" fill="url(#rim)"/>
  <rect x="22" y="22" width="356" height="356" rx="44" fill="url(#bg)"/>
  <circle cx="190" cy="205" r="170" fill="url(#glow)"/>

  <!-- Mana-Tropfen -->
  <path d="M190 52
           C 230 112, 292 172, 292 236
           A 102 102 0 0 1 88 236
           C 88 172, 150 112, 190 52 Z"
        fill="url(#mana)" stroke="#06153d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M168 112 C 140 156, 116 196, 116 236 C 116 262, 128 286, 150 302"
        fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="13" stroke-linecap="round"/>

  <!-- Zahl wie am Button, unten rechts -->
  <text x="352" y="356" text-anchor="end"
        font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="170"
        fill="#ffffff" stroke="#000000" stroke-width="16" stroke-linejoin="round" paint-order="stroke">3</text>
</svg>
